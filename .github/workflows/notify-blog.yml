name: Notify blog

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the blog to pull the new notes
        run: |
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BLOG_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/ilia-iliev/blog/dispatches \
            -d '{"event_type":"content-updated"}'
